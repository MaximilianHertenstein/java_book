[[questions]]
type = "MultipleChoice"
prompt.prompt = "Warum darf eine Methode nicht `return` als Namen haben?"
prompt.distractors = [
  "Weil Methodennamen immer mit einem Großbuchstaben beginnen müssen.",
  "Weil `return` ein Datentyp ist.",
  "Weil Methodennamen keine Buchstaben enthalten dürfen."
]
answer.answer = "Weil `return` ein Schlüsselwort ist, das die Java-Umgebung für eigene Zwecke reserviert."
context = "Schlüsselwörter wie `return` dürfen nicht als Namen von Methoden oder Variablen verwendet werden."
