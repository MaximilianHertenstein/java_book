[[questions]]
type = "MultipleChoice"
prompt.prompt = "Warum kann man in einer Methode eine andere, vorher definierte Methode aufrufen?"
prompt.distractors = [
  "Weil alle Methoden automatisch miteinander verbunden sind.",
  "Weil das nur bei gleichnamigen Parametern erlaubt ist.",
  "Weil Java das nur bei eingebauten Methoden wie `IO.println` erlaubt."
]
answer.answer = "Weil ein Methodenaufruf ein Ausdruck ist und Ausdrücke im Methodenkörper verwendet werden können."
context = "Da Methodenaufrufe Ausdrücke sind, können sie überall dort verwendet werden, wo ein Ausdruck erlaubt ist."
