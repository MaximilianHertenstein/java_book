[[questions]]
type = "MultipleChoice"
prompt.prompt = "Was bedeutet die farbige Markierung in einer Fehlermeldung der Java-Umgebung?"
prompt.distractors = [
  "Sie markiert das Ende des Programms.",
  "Sie zeigt an, wo ein neuer Methodenaufruf beginnt.",
  "Sie zeigt die Gesamtzahl der Fehler im Programm an."
]
answer.answer = "Sie zeigt genau die Stelle, an der die Umgebung den Fehler zuerst bemerkt hat."
context = "Die farbige Markierung zeigt die Position im Code, an der die Syntax nicht mehr den Regeln entspricht (in der klassischen JShell-Konsole steht dort stattdessen ein `^`)."
