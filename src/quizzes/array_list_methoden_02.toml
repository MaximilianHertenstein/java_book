prompt.prompt = "Was liefert `xs.get(0)`, wenn `xs` die Elemente `[5, 6, 7]` enthält?"
prompt.distractors = [
  "Das zweite Element `6`, weil die Zählung bei `1` beginnt.",
  "Die Anzahl der Elemente, also `3`.",
  "Einen Fehler, weil `0` kein gültiger Index ist."
]
answer.answer = "Das erste Element `5`, weil der erste Index `0` ist."
context = "Mit `get` greift man über den Index auf ein Element zu, der erste Index ist `0`."
