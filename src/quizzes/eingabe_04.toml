[[questions]]
type = "MultipleChoice"
prompt.prompt = "Warum muss ein Benutzer eines fertigen Programms nichts über Programmierung wissen, obwohl `IO.readln` und `IO.println` verwendet werden?"
prompt.distractors = [
  "Weil IO.readln() automatisch alle Fehler korrigiert.",
  "Weil IO.println() den Quellcode anzeigt.",
  "Weil das Programm die Eingabe selbst programmiert."
]
answer.answer = "Weil das Programm mit IO.println() erklärt, was einzugeben ist, und mit IO.readln() die Eingabe entgegennimmt, ohne dass der Code sichtbar ist."
context = "IO.println und IO.readln sorgen zusammen dafür, dass ein Skript interaktiv genutzt werden kann, ohne dass der Nutzer den Code sieht oder versteht."
id = "0d1e2f3a-2e3d-4a3a-9e2a-9d1f6b7a3c24"
