type = "MultipleChoice"
prompt.prompt = "Warum ist `2 + 3 * 4` gleich 14 und nicht 20?"
prompt.distractors = [
  "Weil das Plus zuerst gerechnet wird.",
  "Weil Java nur von rechts nach links rechnet.",
  "Weil Klammern fehlen."
]
answer.answer = "Weil die Multiplikation vor der Addition berechnet wird."
context = "Java rechnet zuerst Multiplikation und Division und erst danach Addition und Subtraktion. Deshalb ist `2 + 3 * 4 = 14`."
