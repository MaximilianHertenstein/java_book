[[questions]]
type = "MultipleChoice"
prompt.prompt = "Gilt `private` auch für den `this(...)`-Aufruf in einem anderen Konstruktor?"
prompt.distractors = [
  "Nein, von außen ist deshalb trotzdem alles nutzbar.",
  "Ja, deshalb scheitert auch der Aufruf von innen.",
  "Der `this`-Aufruf umgeht alle Prüfungen des Hauptkonstruktors."
]
answer.answer = "Nein, innerhalb der Klasse sind alle Konstruktoren nutzbar. `private` wirkt nur nach außen."
context = "Ein anderer Konstruktor ruft innen ganz normal den privaten Hauptkonstruktor auf."
