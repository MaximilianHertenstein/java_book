prompt.prompt = "Wofür werden beim Aufruf `new Article(\"Banane\", 3)` Werte übergeben?"
prompt.distractors = [
  "Für alle Methoden im Recordkörper, also auch `priceInCents`.",
  "Für keine Eigenschaft, die Werte entstehen von selbst.",
  "Für Name, Preis und zusätzlich den Cent-Preis."
]
answer.answer = "Nur für die Eigenschaften in der Kopfzeile (`name`, `priceInEuros`)."
context = "`priceInCents()` wird bei jedem Aufruf neu aus dem Euro-Preis berechnet, nicht übergeben."
