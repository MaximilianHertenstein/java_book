[[questions]]
type = "MultipleChoice"
prompt.prompt = "Warum heißen die beiden Hilfsmethoden nicht beide `getFirst`?"
prompt.distractors = [
  "Weil Methodennamen immer eindeutig sein müssen, auch bei verschiedenen Parametern.",
  "Weil `getFirst` ein reserviertes Schlüsselwort ist.",
  "Weil generische Methoden keine Überladung erlauben."
]
answer.answer = "Weil nach dem Löschen der Typangaben beide Köpfe gleich aussähen (`getFirst(List)`) und der Compiler das ablehnt."
context = "Überladung braucht unterschiedliche Parametertypen. `List<Integer>` und `List<Boolean>` zählen dafür nicht als verschieden."
