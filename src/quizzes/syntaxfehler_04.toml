[[questions]]
type = "MultipleChoice"
prompt.prompt = "Ein Schüler sagt: „Der Fehler steht sicher in der letzten Zeile des Programms.“ Was stimmt an dieser Aussage nicht?"
prompt.distractors = [
  "Fehler stehen immer in der letzten Zeile.",
  "Fehler treten immer nur in der ersten Zeile auf.",
  "Die Fehlermeldung nennt immer das Programmende."
]
answer.answer = "Der Syntaxfehler kann in jeder Zeile auftreten. Die Umgebung markiert genau die Stelle, an der das Problem erkannt wurde."
context = "Die markierte Stelle in der Fehlermeldung entspricht der tatsächlichen Fehlerstelle, nicht zwangsläufig dem Programmende."
